name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@f98e06938123ccabd21905ea5d0069192241f9f1 # v8.3.1
        with:
          python-version: "3.12"

      - name: Setup environment
        run: uv venv

      - name: Install package with docs dependencies
        run: uv pip install -e ".[docs]"

      - name: Build documentation
        run: uv run make -C docsrc docs

      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add gh-pages-worktree origin/gh-pages
          else
            git worktree add --detach gh-pages-worktree
            git -C gh-pages-worktree switch --orphan gh-pages
          fi

          find gh-pages-worktree -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docsrc/_build/html/. gh-pages-worktree/
          touch gh-pages-worktree/.nojekyll

          git -C gh-pages-worktree add --all
          if git -C gh-pages-worktree diff --cached --quiet; then
            echo "No documentation changes to deploy."
          else
            git -C gh-pages-worktree commit -m "Deploy docs for ${GITHUB_SHA}"
            git -C gh-pages-worktree push origin HEAD:gh-pages
          fi
